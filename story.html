<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story - thegirlinblackhoodie</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="header-brand">
            <img src="logo.png" alt="thegirlinblackhoodie" class="header-logo">
            <span class="header-name">thegirlinblackhoodie</span>
        </a>
    </header>
    <div class="container">
        <div class="story-container">
            <div class="story-header">
                <a href="stories.html" class="back-link">← Back to Stories</a>
                <h1 class="story-title" id="storyTitle">Loading...</h1>
                <div class="story-meta" id="storyMeta"></div>
            </div>
            
            <div class="story-main-layout">
                <div class="story-content-wrapper">
                    <div class="story-content" id="storyContent">
                        <div class="empty-state">Loading story...</div>
                    </div>
                </div>
                
                <div class="story-images-wrapper">
                    <div class="story-images-gallery" id="storyImagesGallery">
                        <!-- Images will be loaded here -->
                    </div>
                </div>
            </div>
            
            <div class="story-actions">
                <div class="hashtags-section" id="hashtagsSection" style="display: none;"></div>
            </div>
        </div>
    </div>
    
    <footer class="site-footer">
        <div class="show-love-section">
            <p class="show-love-text">Liked it? Show some love ❤️</p>
            <a href="mailto:blackhoodgirlie@gmail.com" class="email-link">
                <svg class="gmail-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
                </svg>
                <span class="email-address">blackhoodgirlie@gmail.com</span>
            </a>
        </div>
    </footer>
    
    <script src="story.js"></script>
</body>
</html>
